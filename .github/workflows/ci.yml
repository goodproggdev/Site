name: CI — Site Project

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.12"

jobs:
  # ─── BACKEND TESTS ──────────────────────────────────────────────────
  backend:
    name: Backend Django Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django coverage

      - name: Create .env for CI
        run: |
          cat > .env << EOF
          DEBUG=True
          SECRET_KEY=ci-test-secret-key-not-for-production
          ALLOWED_HOSTS=localhost,127.0.0.1
          CORS_ALLOWED_ORIGINS=http://localhost:5173
          EMAIL_BACKEND=django.core.mail.backends.console.EmailBackend
          STRIPE_SECRET_KEY=
          STRIPE_PUBLISHABLE_KEY=
          STRIPE_WEBHOOK_SECRET=
          JWT_ACCESS_TOKEN_LIFETIME_MINUTES=60
          JWT_REFRESH_TOKEN_LIFETIME_DAYS=7
          EOF

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run tests with coverage
        run: |
          coverage run --source='.' manage.py test api --verbosity=2
          coverage report --fail-under=50
          coverage xml

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: backend/coverage.xml
          flags: backend

  # ─── BACKEND LINT ──────────────────────────────────────────────────
  backend-lint:
    name: Backend Lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff
        run: pip install ruff
      - name: Lint with ruff
        run: ruff check . --exclude env/,resume_matcher_env/,__pycache__/

  # ─── FRONTEND TESTS ─────────────────────────────────────────────────
  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8000

      - name: Run Vitest
        run: npm run test -- --run

  # ─── FRONTEND BUDGET CHECK ──────────────────────────────────────────
  frontend-budget:
    name: Frontend Performance Budget
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8000

      - name: Check bundle size
        run: |
          echo "Checking bundle size..."
          du -sh dist/
          
          # Check main JS chunk size (should be < 500KB)
          MAIN_JS=$(find dist/assets -name "*.js" -type f -exec ls -lh {} \; | sort -k5 -hr | head -1)
          echo "Main JS chunk: $MAIN_JS"
          
          # Fail if main chunk > 500KB
          MAIN_SIZE=$(echo $MAIN_JS | awk '{print $5}')
          if [[ $MAIN_SIZE == *"M" ]]; then
            echo "❌ Bundle too large (>1MB)"
            exit 1
          fi
          
          echo "✅ Bundle size OK"

  # ─── E2E TESTS (Playwright) ─────────────────────────────────────────
  # Gira solo contro il build statico del frontend (`vite preview`, vedi
  # playwright.config.ts webServer), senza backend Django live in CI: i test
  # che richiedono l'API (auth-login.spec.ts) si auto-skippano tramite
  # E2E_SKIP_AUTH_LOGIN, mentre site-audit.spec.ts (navigazione, modali,
  # pagine pubbliche) gira per davvero e intercetta regressioni reali di UI.
  # `continue-on-error: true` finche' non abbiamo una prima run reale in CI
  # da cui verificare l'affidabilita' — vedi BACKLOG.md TEST-002.
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test
        env:
          E2E_SKIP_AUTH_LOGIN: "1"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # ─── DOCKER BUILD CHECK ─────────────────────────────────────────────
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Build frontend Docker image
        run: |
          cd frontend
          docker build -t cv-frontend:test .

      - name: Build backend Docker image
        run: |
          cd backend
          docker build -t cv-backend:test .

      - name: Test docker-compose
        run: |
          docker-compose config
