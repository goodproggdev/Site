<!DOCTYPE html>
<html lang="{{ html_lang }}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page_title }}</title>
  <meta name="description" content="{{ meta_description }}" />
  <link rel="canonical" href="{{ canonical_url }}" />

  <meta property="og:type" content="profile" />
  <meta property="og:url" content="{{ og_url }}" />
  <meta property="og:title" content="{{ og_title }}" />
  <meta property="og:description" content="{{ og_description }}" />
  <meta property="og:image" content="{{ og_image }}" />
  <meta property="og:site_name" content="{{ site_name }}" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{ og_title }}" />
  <meta name="twitter:description" content="{{ og_description }}" />
  <meta name="twitter:image" content="{{ og_image }}" />

  <link rel="icon" type="image/png" href="/logo-nordev.png" />
  {% for href in spa_stylesheets %}
  <link rel="stylesheet" href="{{ href }}" crossorigin />
  {% endfor %}

  <script type="application/ld+json">{{ json_ld|safe }}</script>
</head>
<body class="bg-white text-gray-900">
  <div id="root"></div>
  <noscript>
    <main style="max-width:40rem;margin:2rem auto;padding:1rem;font-family:system-ui,sans-serif;">
      <h1 style="font-size:1.25rem;">{{ page_title }}</h1>
      <p>{{ meta_description }}</p>
      <p><a href="{{ spa_fallback_href }}">{{ spa_fallback_href }}</a></p>
    </main>
  </noscript>
  {% for src in spa_scripts %}
  <script type="module" src="{{ src }}" crossorigin></script>
  {% endfor %}
  {% if not spa_scripts %}
  <div style="max-width:40rem;margin:2rem auto;padding:1rem;font-family:system-ui,sans-serif;">
    <p style="color:#4b5563;">Versione interattiva (richiede build frontend sullo stesso host o variabile FRONTEND_ASSET_ORIGIN):</p>
    <p><a href="{{ spa_fallback_href }}" style="color:#4f46e5;">{{ spa_fallback_href }}</a></p>
  </div>
  {% endif %}
</body>
</html>
