services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: cvplatform
      POSTGRES_USER: cvplatform
      POSTGRES_PASSWORD: cvplatform
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgres://cvplatform:cvplatform@db:5432/cvplatform
      USE_S3_STORAGE: "true"
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_STORAGE_BUCKET_NAME: cv-assets
      AWS_S3_REGION_NAME: us-east-1
      AWS_S3_ENDPOINT_URL: http://minio:9000
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      CSRF_TRUSTED_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      - db
      - minio

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pg_data:
  minio_data:
